# Required checks never use on-level path filters: a `changes` job decides what
# runs. gitleaks and denylist always run (drafts included).
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.f.outputs.firmware == 'true' || steps.f.outputs.full == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Only PRs have a base to diff against. Outside PRs the step is skipped and
      # the `firmware` output above is forced to true (fail-safe: build everything).
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            full:
              - ".github/**"
              - "platformio.ini"
              - "partitions*.csv"
              - "keys/**"
              - "hooks/**"
              - ".gitleaks*"
            firmware:
              - "src/**"
              - "include/**"
              - "lib/**"
              - "scripts/**"

  build-matrix:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: [cyd, m5stack-stopwatch]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'requirements.txt') }}
      - run: pip install --require-hashes -r requirements.txt
      - name: Build
        run: |
          set -o pipefail
          pio run -e ${{ matrix.env }} | tee build.log
          { echo '```'; echo '${{ matrix.env }}'; grep -E 'RAM:|Flash:' build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Required check name stays "build" so the ruleset keeps working with the matrix.
  build:
    needs: [changes, build-matrix]
    if: ${{ always() && !cancelled() && !github.event.pull_request.draft && needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 2
    steps:
      - name: Require every firmware target
        run: test "${{ needs.build-matrix.result }}" = "success"

  guard:
    needs: changes
    if: ${{ !github.event.pull_request.draft && needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Passive-only guard
        run: scripts/guard.sh

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (pinned binary, checksum verified)
        env:
          GL_VER: 8.30.1
          GL_SHA: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          echo "${GL_SHA}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .

  denylist:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Deny-list check (list comes from a secret, matches never printed)
        env:
          DENYLIST_B64: ${{ secrets.DENYLIST_B64 }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$DENYLIST_B64" ]; then
            if [ "$IS_MAIN" = "true" ]; then echo "::error::DENYLIST_B64 secret is required on main"; exit 1; fi
            echo "::warning::DENYLIST_B64 not available (fork PR or not configured): deny-list check skipped"; exit 0
          fi
          umask 077
          list="$RUNNER_TEMP/dl.txt"
          printf '%s' "$DENYLIST_B64" | base64 -d > "$list"
          # PRs: the PR's own commits (head SHA, not GitHub's synthetic merge commit). Pushes to main / manual runs: the FULL history (authors, committers, messages).
          if [ -n "$BASE_SHA" ]; then export DENYLIST_GIT_RANGE="$BASE_SHA..$HEAD_SHA"; else export DENYLIST_GIT_RANGE="HEAD"; fi
          rc=0; scripts/denylist-check.sh "$list" || rc=$?
          rm -f "$list"
          exit $rc
