[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_flash = 40000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
lib_compat_mode = strict
lib_ldf_mode = deep+
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.0
    h2zero/NimBLE-Arduino@1.4.3
extra_scripts = pre:scripts/pio_pre_build.py
build_flags =
    -Os
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=lv_conf.h
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCORE_DEBUG_LEVEL=1

; Official PlatformIO path for the M5Stack StopWatch Dev Kit (SKU C152):
; espressif32 6.12.0 (Arduino-ESP32 2.0.17, same generation as CYD's 6.9.0),
; board esp32s3box + qio_opi + 16 MB, M5Unified + M5GFX.
; CYD stays on espressif32 6.9.0 / LovyanGFX and is not moved to Arduino 3.x.
; M5PM1 and M5IOE1 are already vendored inside M5Unified, so they are not
; listed separately (duplicate-symbol risk).
[env:m5stack-stopwatch]
platform = espressif32@6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions_stopwatch.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
lib_compat_mode = strict
lib_ldf_mode = deep+
lib_deps =
    lvgl/lvgl@9.2.2
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.35
    h2zero/NimBLE-Arduino@1.4.3
extra_scripts = pre:scripts/pio_pre_build.py
build_flags =
    -Os
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=lv_conf.h
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -DCYD32_HW_M5STACK_STOPWATCH
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCORE_DEBUG_LEVEL=1
