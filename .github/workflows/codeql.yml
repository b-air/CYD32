# Not a required check. Code scanning on private repos needs GitHub Advanced
# Security, so it only runs once the repository is public.
name: codeql
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["src/**"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    if: ${{ github.event.repository.visibility == 'public' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          languages: c-cpp
          build-mode: none
      - uses: github/codeql-action/analyze@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
